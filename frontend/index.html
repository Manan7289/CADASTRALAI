<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CadastraAI — Cadastral Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="wordmark">CADASTRA<span>AI</span></div>
      <div class="subtitle">Cadastral Map · Igatpuri, Maharashtra · Team ELAVI</div>
    </div>
    <nav class="segmented">
      <a href="index.html" class="active">CADASTRAL MAP</a>
      <a href="detection.html">COMPLIANCE &amp; DETECTION</a>
      <a href="model.html">MODEL OUTPUT</a>
      <a href="upload.html">UPLOAD YOUR OWN</a>
    </nav>
    <div class="segmented" id="surveyToggle">
      <a href="index.html?session=clear_drone_survey" id="btnDrone" style="text-decoration:none;padding:6px 11px;font-family:var(--font-mono);font-size:0.7rem;display:inline-block;">🚁 CLEAR DRONE SURVEY</a>
      <a href="index.html?legacy=1" id="btnTown" style="text-decoration:none;padding:6px 11px;font-family:var(--font-mono);font-size:0.7rem;display:inline-block;">🏙 TOWN WARD</a>
    </div>
    <div class="segmented" id="layerControlBar" style="display:flex;align-items:center;padding:2px 8px;gap:8px;">
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="parcelToggle" checked> Parcels</label>
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="buildingToggle" checked> 🏠 Bldgs</label>
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="forestToggle" checked> 🌲 Forest</label>
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="farmToggle" checked> 🌾 Farms</label>
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="barrenToggle" checked> 🏜️ Barren</label>
      <label class="toggle-field" style="cursor:pointer;font-size:0.72rem;margin:0;"><input type="checkbox" id="bufferToggle" checked> Buffers</label>
    </div>
    <a id="dxfExportBtn" href="#" download="cadastre.dxf" class="ghost-btn" style="text-decoration:none;font-size:0.72rem;padding:6px 12px;border-radius:6px;color:var(--accent);border-color:var(--accent);">📐 Export DXF (CAD)</a>
    <div class="status-chip" id="statusChip" style="color:var(--ok);border-color:rgba(108,190,129,0.4);background:rgba(108,190,129,0.08);"><span style="width:6px;height:6px;border-radius:50%;background:var(--ok);"></span>Contiguous Cadastral Parcels · UAV Survey</div>
  </header>

  <main class="workspace">
    <div class="map-panel">
      <div id="map"></div>
      <div class="loading" id="loadingScreen">Loading real AOI data and delineating parcels…</div>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="shared.js"></script>
<script>
(function(){
"use strict";

var map = initMap();
var state = {
  selectedParcelId: null,
  parcelsFc: null,
  buildingsFc: null,
  forestFc: null,
  farmsFc: null,
  barrenFc: null
};
var parcelLayer, buildingLayer, forestLayer, farmLayer, barrenLayer;

Promise.all([
  fetch(dataUrl('meta.json')).then(r=>r.json()),
  fetch(dataUrl('image.png')).then(r=>r.blob()),
  fetch(dataUrl('layers.json')).then(r=>r.json()),
  fetch(dataUrl('parcels.geojson')).then(r=>r.json()),
  fetch(dataUrl('buildings.geojson')).then(r=>r.json()),
  fetch(dataUrl('forest.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('farms.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('barren_land.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]}))
]).then(function(res){
  var meta = res[0], imgBlob = res[1], layers = res[2];
  var parcelsFc = res[3], buildingsFc = res[4];
  var forestFc = res[5] || {type:'FeatureCollection',features:[]};
  var farmsFc = res[6] || {type:'FeatureCollection',features:[]};
  var barrenFc = res[7] || {type:'FeatureCollection',features:[]};

  var refs = loadBaseLayers(map, meta, imgBlob, layers);
  document.getElementById('bufferToggle').addEventListener('change', function(e){
    if(e.target.checked) map.addLayer(refs.bufferGroup); else map.removeLayer(refs.bufferGroup);
  });
  var dxfBtn = document.getElementById('dxfExportBtn');
  if(dxfBtn) dxfBtn.href = dxfDownloadUrl();

  var curSess = currentSessionId();
  var isDrone = (curSess === 'clear_drone_survey');
  var bDrone = document.getElementById('btnDrone');
  var bTown = document.getElementById('btnTown');
  if(bDrone && bTown){
    if(isDrone){
      bDrone.style.background = 'var(--accent)';
      bDrone.style.color = '#04211D';
      bDrone.style.fontWeight = 'bold';
      bTown.style.background = 'transparent';
      bTown.style.color = 'var(--text-dim)';
    } else {
      bTown.style.background = 'var(--accent)';
      bTown.style.color = '#04211D';
      bTown.style.fontWeight = 'bold';
      bDrone.style.background = 'transparent';
      bDrone.style.color = 'var(--text-dim)';
    }
  }
  state.parcelsFc = parcelsFc;
  state.buildingsFc = buildingsFc;
  state.forestFc = forestFc;
  state.farmsFc = farmsFc;
  state.barrenFc = barrenFc;

  // Farm Plots Layer
  farmLayer = L.geoJSON(farmsFc, {
    interactive: true,
    style: {color: '#386641', weight: 1.8, fillColor: '#8FAE5D', fillOpacity: 0.35, dashArray: '4 3'},
    onEachFeature: function(f, layer){
      var p = f.properties;
      var tip = '<b>🌾 ' + (p.uid || ('Plot #' + p.id)) + '</b><br>Area: ' + (p.area_guntha || 0) + ' Guntha (' + (p.area_acres || 0) + ' Ac)<br>Canopy Index (CCI): ' + (p.crop_canopy_index || 'High');
      layer.bindTooltip(tip, {sticky: true, direction: 'top'});
    }
  }).addTo(map);

  // Barren Land Layer
  barrenLayer = L.geoJSON(barrenFc, {
    interactive: true,
    style: {color: '#7F5539', weight: 1.5, fillColor: '#BFA27E', fillOpacity: 0.40},
    onEachFeature: function(f, layer){
      var p = f.properties;
      var tip = '<b>🏜️ ' + (p.uid || ('Barren #' + p.id)) + '</b><br>Area: ' + (p.area_guntha || 0) + ' Guntha (' + (p.area_m2 || 0) + ' m²)<br>Soil Tone (STI): ' + (p.soil_tone_index || 'Dry Earth');
      layer.bindTooltip(tip, {sticky: true, direction: 'top'});
    }
  }).addTo(map);

  // Discrete Forest Canopy Layer
  forestLayer = L.geoJSON(forestFc, {
    interactive: true,
    style: {color: '#1A4D2E', weight: 1.5, fillColor: '#2A5C3F', fillOpacity: 0.65},
    onEachFeature: function(f, layer){
      var p = f.properties;
      var tip = '<b>🌲 ' + (p.uid || ('Forest #' + p.id)) + '</b><br>Area: ' + (p.area_guntha || 0) + ' Guntha (' + (p.area_acres || 0) + ' Ac)<br>' + (p.forest_type || 'Forest Zone') + '<br>Density: ' + Math.round((p.forest_density || 0) * 100) + '%';
      layer.bindTooltip(tip, {sticky: true, direction: 'top'});
    }
  }).addTo(map);

  // Buildings Layer
  buildingLayer = L.geoJSON(buildingsFc, {
    interactive: false,
    style: {color: '#28352E', weight: 1.2, fillColor: '#6CBE81', fillOpacity: 0.75}
  }).addTo(map);

  // Wire up layer toggles
  document.getElementById('parcelToggle').addEventListener('change', function(e){
    if(e.target.checked) { if(!map.hasLayer(parcelLayer)) map.addLayer(parcelLayer); }
    else { if(map.hasLayer(parcelLayer)) map.removeLayer(parcelLayer); }
  });
  document.getElementById('buildingToggle').addEventListener('change', function(e){
    if(e.target.checked) { if(!map.hasLayer(buildingLayer)) map.addLayer(buildingLayer); }
    else { if(map.hasLayer(buildingLayer)) map.removeLayer(buildingLayer); }
  });
  document.getElementById('forestToggle').addEventListener('change', function(e){
    if(e.target.checked) { if(!map.hasLayer(forestLayer)) map.addLayer(forestLayer); }
    else { if(map.hasLayer(forestLayer)) map.removeLayer(forestLayer); }
  });
  document.getElementById('farmToggle').addEventListener('change', function(e){
    if(e.target.checked) { if(!map.hasLayer(farmLayer)) map.addLayer(farmLayer); }
    else { if(map.hasLayer(farmLayer)) map.removeLayer(farmLayer); }
  });
  document.getElementById('barrenToggle').addEventListener('change', function(e){
    if(e.target.checked) { if(!map.hasLayer(barrenLayer)) map.addLayer(barrenLayer); }
    else { if(map.hasLayer(barrenLayer)) map.removeLayer(barrenLayer); }
  });

  renderParcels();
  renderSidebar();
  document.getElementById('loadingScreen').style.display = 'none';
}).catch(function(err){
  document.getElementById('loadingScreen').textContent = 'Failed to load: ' + err + '  (did you run the backend pipeline through build_static.py first?)';
});

function renderParcels(){
  if(parcelLayer) map.removeLayer(parcelLayer);
  parcelLayer = L.geoJSON(state.parcelsFc, {
    style:function(f){
      var selected = f.properties.id===state.selectedParcelId;
      return {
        color: selected ? '#45C7B8' : '#F2E9DC',
        weight: selected ? 3.2 : 1.5,
        opacity: selected ? 1 : 0.9,
        dashArray: null,
        fillColor: LANDUSE_COLOR[f.properties.landuse] || '#485850',
        fillOpacity: 0.32
      };
    },
    onEachFeature:function(f, layer){
      layer.on('click', function(){
        state.selectedParcelId = f.properties.id;
        renderParcels(); renderSidebar();
      });
    }
  });
  var pToggle = document.getElementById('parcelToggle');
  if(!pToggle || pToggle.checked) {
    parcelLayer.addTo(map);
  }
}

var inspector = document.getElementById('inspector');

function renderSidebar(){
  if(state.selectedParcelId!=null){ renderParcelDetail(); return; }

  var parcels = state.parcelsFc.features;
  var landlocked = parcels.filter(f => !f.properties.road_connected);
  var unrecordedParcels = parcels.filter(f => f.properties.has_unrecorded_building);
  var forestCount = (state.forestFc && state.forestFc.features) ? state.forestFc.features.length : 0;
  var farmCount = (state.farmsFc && state.farmsFc.features) ? state.farmsFc.features.length : 0;
  var barrenCount = (state.barrenFc && state.barrenFc.features) ? state.barrenFc.features.length : 0;
  var bldgCount = (state.buildingsFc && state.buildingsFc.features) ? state.buildingsFc.features.length : 0;
  var landuseMix = {};
  parcels.forEach(function(f){ landuseMix[f.properties.landuse] = (landuseMix[f.properties.landuse]||0)+1; });

  var html = '';
  html += '<div><h3 class="panel-title">Ward Overview</h3><div class="stat-grid">'+
    '<div class="stat-tile"><div class="num">'+parcels.length+'</div><div class="lbl">Land parcels mapped</div></div>'+
    '<div class="stat-tile"><div class="num">'+bldgCount+'</div><div class="lbl">Buildings inside them</div></div>'+
    '<div class="stat-tile"><div class="num" style="color:#2A5C3F">'+forestCount+'</div><div class="lbl">🌲 Forest zones</div></div>'+
    '<div class="stat-tile"><div class="num" style="color:#8FAE5D">'+farmCount+'</div><div class="lbl">🌾 Farm plots delineated</div></div>'+
    '<div class="stat-tile"><div class="num" style="color:#BFA27E">'+barrenCount+'</div><div class="lbl">🏜️ Barren land zones</div></div>'+
    '<div class="stat-tile"><div class="num" style="color:'+(unrecordedParcels.length?'var(--change)':'var(--ok)')+'">'+unrecordedParcels.length+'</div><div class="lbl">Hold unrecorded structures</div></div>'+
  '</div></div>';

  var priority = landlocked.concat(unrecordedParcels.filter(f => landlocked.indexOf(f)===-1)).slice(0,8);
  if(priority.length===0){ priority = parcels.slice(0,8); }
  html += '<div><h3 class="panel-title">Parcels To Verify</h3>';
  priority.forEach(function(f){
    var p = f.properties;
    var flags = [];
    if(!p.road_connected) flags.push('<span class="dot" style="background:var(--warning);"></span>');
    if(p.has_unrecorded_building) flags.push('<span class="dot" style="background:var(--change);"></span>');
    html += '<div class="queue-row" data-id="'+p.id+'"><span class="id">#'+p.id+'</span><span class="dots">'+flags.join('')+'</span><span class="area">'+p.area_m2+' m²</span></div>';
  });
  html += '</div>';

  html += '<div><h3 class="panel-title">Land-Use Mix</h3>';
  Object.keys(LANDUSE_COLOR).forEach(function(k){
    if(!landuseMix[k]) return;
    html += '<div class="legend-row"><span style="width:16px;height:16px;border-radius:3px;background:'+LANDUSE_COLOR[k]+';opacity:0.55;flex:none;"></span><div><b>'+k+'</b><small>'+landuseMix[k]+' parcels</small></div></div>';
  });
  html += '<div style="font-size:0.68rem;color:var(--text-faint);margin-top:8px;line-height:1.5;">Parcel boundaries are inferred — a Voronoi tessellation around each real building position, clipped by the real road/rail/water network — since land-ownership records aren\'t public data. Treat this as a candidate layer for field verification, not a surveyed cadastral record.</div></div>';

  inspector.innerHTML = html;
  inspector.querySelectorAll('.queue-row').forEach(function(row){
    row.addEventListener('click', function(){
      state.selectedParcelId = parseInt(row.getAttribute('data-id'),10);
      renderParcels(); renderSidebar();
    });
  });
}

function renderParcelDetail(){
  var f = state.parcelsFc.features.find(x=>x.properties.id===state.selectedParcelId);
  if(!f){ state.selectedParcelId=null; renderSidebar(); return; }
  var p = f.properties;
  var luColor = LANDUSE_COLOR[p.landuse] || '#5C6B63';

  var html = '<div><h3 class="panel-title"><span class="back" id="backBtnP">&larr; Overview</span></h3>';
  html += '<div class="detail-head"><h2>Parcel #'+p.id+'</h2><span style="color:'+luColor+';font-family:var(--font-mono);font-size:0.7rem;text-transform:uppercase;">'+p.landuse+'</span></div>';
  if(p.ulpin){
    html += '<div style="font-family:var(--font-mono);font-size:0.72rem;background:rgba(69,199,184,0.1);border:1px solid rgba(69,199,184,0.3);color:var(--accent);padding:4px 8px;border-radius:4px;display:inline-block;margin:4px 0 10px 0;">ULPIN: '+p.ulpin+'</div>';
  }

  var areaStr = p.area_m2 + ' m²';
  if(p.area_guntha) areaStr += ' (' + p.area_guntha + ' Guntha)';
  else if(p.area_sq_ft) areaStr += ' (' + p.area_sq_ft + ' sq.ft)';

  html += '<div class="kv-grid">'+
    '<div class="kv"><div class="k">Total Area</div><div class="v">'+areaStr+'</div></div>'+
    '<div class="kv"><div class="k">Perimeter</div><div class="v">'+p.perimeter_m+' m</div></div>'+
    '<div class="kv"><div class="k">Buildings</div><div class="v">'+p.building_count+' structures</div></div>'+
    '<div class="kv"><div class="k">Road access</div><div class="v" style="color:'+(p.road_connected?'var(--ok)':'var(--critical)')+'">'+(p.road_connected?'Frontage Connected':'~'+p.road_distance_m+' m away')+'</div></div>';

  if(p.built_up_area_m2 != null){
    html += '<div class="kv"><div class="k">Built-up Plinth</div><div class="v">'+p.built_up_area_m2+' m²</div></div>'+
      '<div class="kv"><div class="k">Open Yard Space</div><div class="v">'+p.open_space_m2+' m²</div></div>'+
      '<div class="kv"><div class="k">Coverage (GCR)</div><div class="v">'+(p.ground_coverage_ratio_pct||0)+'%</div></div>';
  }

  if(p.crop_cover_pct != null || p.barren_cover_pct != null || p.cultivable_area_acres != null){
    var cropStr = (p.crop_cover_pct != null ? p.crop_cover_pct + '%' : '0%');
    if(p.cultivable_area_acres) cropStr += ' (' + p.cultivable_area_acres + ' Ac)';
    html += '<div class="kv"><div class="k">🌾 Crop Cover</div><div class="v">'+cropStr+'</div></div>'+
      '<div class="kv"><div class="k">🌲 Canopy Cover</div><div class="v">'+(p.tree_cover_pct||0)+'%</div></div>'+
      '<div class="kv"><div class="k">🏜️ Barren Soil</div><div class="v">'+(p.barren_cover_pct||0)+'%</div></div>';
  }

  var latStr = (p.gps_lat != null && typeof p.gps_lat === 'number') ? p.gps_lat.toFixed(5) : (p.gps_lat || '0.00000');
  var lonStr = (p.gps_lon != null && typeof p.gps_lon === 'number') ? p.gps_lon.toFixed(5) : (p.gps_lon || '0.00000');
  html += '<div class="kv" style="grid-column:1/-1;"><div class="k">GPS centroid (approx.)</div><div class="v">'+latStr+'° N, '+lonStr+'° E</div></div>'+
  '</div>';

  html += '<div style="margin:14px 0;">'+
    '<a href="'+propertyCardUrl(p.id)+'" target="_blank" class="ghost-btn" style="display:block;text-align:center;text-decoration:none;background:rgba(69,199,184,0.12);color:var(--accent);border-color:var(--accent);padding:9px 12px;border-radius:6px;font-weight:600;font-size:0.8rem;">🖨 View SVAMITVA Cadastral Card</a>'+
  '</div>';

  if(p.traverse_points && p.traverse_points.length > 0){
    html += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);">'+
      '<h4 style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);margin:0 0 6px 0;">Demarcated Corner Traverse</h4>'+
      '<table style="width:100%;border-collapse:collapse;font-size:0.72rem;font-family:var(--font-mono);">'+
      '<tr style="color:var(--text-faint);border-bottom:1px solid var(--border-soft);"><th style="text-align:left;padding:3px;">Pt</th><th style="text-align:left;padding:3px;">Coordinates</th><th style="text-align:right;padding:3px;">Side Length</th></tr>';
    p.traverse_points.slice(0, 8).forEach(function(t){
      var tLat = (t.lat != null && typeof t.lat === 'number') ? t.lat.toFixed(5) : (t.lat || '0.00000');
      var tLon = (t.lon != null && typeof t.lon === 'number') ? t.lon.toFixed(5) : (t.lon || '0.00000');
      html += '<tr style="border-bottom:1px solid var(--border-soft);"><td style="padding:4px 3px;color:var(--accent);font-weight:bold;">'+t.point_id+'</td><td style="padding:4px 3px;">'+tLat+'°N, '+tLon+'°E</td><td style="padding:4px 3px;text-align:right;">'+t.segment_length_m+'m</td></tr>';
    });
    html += '</table></div>';
  }

  var findings = [];
  if(!p.road_connected){
    findings.push({sev:'warning', shape:'square', label:'No Direct Road Frontage', msg:'Nearest access corridor is ~'+p.road_distance_m+' m away. Review easement access on the ground.'});
  }
  if(p.has_unrecorded_building){
    findings.push({sev:'change', shape:'circle', label:'Contains Unrecorded Structure', msg:'AI detected structure with no match in official record. Review permit.'});
  }
  if(findings.length){
    html += '<div class="findings" style="margin-top:12px;">';
    findings.forEach(function(a){
      html += '<div class="finding sev-'+a.sev+'">'+iconSvg(a.shape,a.sev,18)+'<div><b>'+a.label+'</b><p>'+a.msg+'</p></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="clean-msg" style="margin-top:12px;">&#10003; No compliance issues detected by automated rule engine</div>';
  }

  html += '</div>';

  inspector.innerHTML = html;
  document.getElementById('backBtnP').addEventListener('click', function(){ state.selectedParcelId=null; renderParcels(); renderSidebar(); });
}

})();
</script>
</body>
</html>
