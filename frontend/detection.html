<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CadastraAI — Compliance &amp; Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="wordmark">CADASTRA<span>AI</span></div>
      <div class="subtitle">AI Feature Detection · Buildings, Trees, Farms &amp; Barren Land · Team ELAVI</div>
    </div>
    <nav class="segmented">
      <a href="index.html">CADASTRAL MAP</a>
      <a href="detection.html" class="active">COMPLIANCE &amp; DETECTION</a>
      <a href="model.html">MODEL OUTPUT</a>
      <a href="upload.html">UPLOAD YOUR OWN</a>
    </nav>
    <div class="segmented" id="surveyToggle">
      <a href="detection.html?session=clear_drone_survey" id="btnDrone" style="text-decoration:none;padding:6px 11px;font-family:var(--font-mono);font-size:0.7rem;display:inline-block;">🚁 CLEAR DRONE SURVEY</a>
      <a href="detection.html?legacy=1" id="btnTown" style="text-decoration:none;padding:6px 11px;font-family:var(--font-mono);font-size:0.7rem;display:inline-block;">🏙 TOWN WARD</a>
    </div>
    <div class="segmented" id="categoryFilter">
      <button data-cat="all" class="active">ALL</button>
      <button data-cat="building">🏠 BUILDINGS</button>
      <button data-cat="tree">🌳 TREES</button>
      <button data-cat="farm">🌾 FARMS</button>
      <button data-cat="barren">🏜️ BARREN</button>
      <button data-cat="veg">🌿 VEG</button>
    </div>
    <div class="segmented" id="layerToggle">
      <button data-layer="model" class="active">AI-EXTRACTED</button>
      <button data-layer="osm">OFFICIAL (OSM)</button>
    </div>
    <label class="toggle-field"><input type="checkbox" id="bufferToggle" checked> Buffer zones</label>
    <div class="status-chip" id="statusChip">AI Vision Active</div>
  </header>

  <main class="workspace">
    <div class="map-panel">
      <div id="map"></div>
      <div class="loading" id="loadingScreen">Loading drone imagery and extracting landcover features…</div>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="shared.js"></script>
<script>
(function(){
"use strict";

var map = initMap();
var state = {
  source: 'model',
  activeCategory: 'all',
  selectedFeature: null,
  modelFc: null,
  osmFc: null,
  treesFc: null,
  farmsFc: null,
  barrenFc: null,
  vegFc: null,
  metrics: null,
  reports: {}
};
var geoLayersGroup = L.layerGroup().addTo(map);

Promise.all([
  fetch(dataUrl('meta.json')).then(r=>r.json()),
  fetch(dataUrl('image.png')).then(r=>r.blob()),
  fetch(dataUrl('layers.json')).then(r=>r.json()),
  fetch(dataUrl('buildings.geojson')).then(r=>r.json()),
  fetch(dataUrl('osm_buildings.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('metrics.json')).then(r=>r.json()).catch(()=>({})),
  fetch(dataUrl('reports.json')).then(r=>r.json()).catch(()=>({})),
  fetch(dataUrl('trees.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('farms.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('barren_land.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]})),
  fetch(dataUrl('vegetation.geojson')).then(r=>r.json()).catch(()=>({type:'FeatureCollection',features:[]}))
]).then(function(res){
  var meta = res[0], imgBlob = res[1], layers = res[2];
  state.modelFc = res[3];
  state.osmFc = res[4];
  state.metrics = res[5];
  state.reports = res[6] || {};
  state.treesFc = res[7] || {type:'FeatureCollection',features:[]};
  state.farmsFc = res[8] || {type:'FeatureCollection',features:[]};
  state.barrenFc = res[9] || {type:'FeatureCollection',features:[]};
  state.vegFc = res[10] || {type:'FeatureCollection',features:[]};

  var refs = loadBaseLayers(map, meta, imgBlob, layers);
  document.getElementById('bufferToggle').addEventListener('change', function(e){
    if(e.target.checked) map.addLayer(refs.bufferGroup); else map.removeLayer(refs.bufferGroup);
  });

  var curSess = currentSessionId();
  var isDrone = (curSess === 'clear_drone_survey');
  var bDrone = document.getElementById('btnDrone');
  var bTown = document.getElementById('btnTown');
  if(bDrone && bTown){
    if(isDrone){
      bDrone.style.background = 'var(--accent)';
      bDrone.style.color = '#04211D';
      bDrone.style.fontWeight = 'bold';
      bTown.style.background = 'transparent';
      bTown.style.color = 'var(--text-dim)';
    } else {
      bTown.style.background = 'var(--accent)';
      bTown.style.color = '#04211D';
      bTown.style.fontWeight = 'bold';
      bDrone.style.background = 'transparent';
      bDrone.style.color = 'var(--text-dim)';
    }
  }

  renderFeatures();
  renderSidebar();
  document.getElementById('loadingScreen').style.display = 'none';
}).catch(function(err){
  document.getElementById('loadingScreen').textContent = 'Failed to load: ' + err;
});

function severityOf(props){
  var alerts = props.alerts || [];
  if(alerts.some(a=>(ALERT_META[a.type] && ALERT_META[a.type].sev==='critical'))) return 'critical';
  if(alerts.some(a=>(ALERT_META[a.type] && ALERT_META[a.type].sev==='warning'))) return 'warning';
  if(alerts.some(a=>(ALERT_META[a.type] && ALERT_META[a.type].sev==='change'))) return 'change';
  return 'ok';
}

function getFeatureCategory(f){
  var t = (f.properties && f.properties.type) || '';
  if(t === 'tree_canopy') return 'tree';
  if(t === 'farm_plot') return 'farm';
  if(t === 'barren_land') return 'barren';
  if(t === 'vegetation') return 'veg';
  return 'building';
}

function getFeatureIcon(cat){
  switch(cat){
    case 'tree': return '🌳';
    case 'farm': return '🌾';
    case 'barren': return '🏜️';
    case 'veg': return '🌿';
    default: return '🏠';
  }
}

function getFeatureStyle(f, isSelected){
  var cat = getFeatureCategory(f);
  var p = f.properties || {};

  if(isSelected){
    return {color:'#45C7B8', weight:3.2, fillColor:'#45C7B8', fillOpacity:0.65};
  }

  switch(cat){
    case 'tree':
      return {color:'#1B4332', weight:1.5, fillColor:'#2D6A4F', fillOpacity:0.65};
    case 'farm':
      return {color:'#40916C', weight:1.8, fillColor:'#8FAE5D', fillOpacity:0.55};
    case 'barren':
      return {color:'#7F5539', weight:1.8, fillColor:'#BFA27E', fillOpacity:0.60};
    case 'veg':
      return {color:'#2D6A4F', weight:1.2, fillColor:'#52B788', fillOpacity:0.40};
    case 'building':
    default:
      var sev = state.source==='model' ? severityOf(p) : 'ok';
      var fillCol = p.unrecorded ? '#E2685F' : (sev==='ok' ? '#6CBE81' : SEV_COLOR[sev]);
      return {
        color: '#28352E',
        weight: sev==='ok' ? 1.0 : 1.8,
        fillColor: fillCol,
        fillOpacity: 0.65
      };
  }
}

function renderFeatures(){
  geoLayersGroup.clearLayers();
  var cat = state.activeCategory;

  var collections = [];
  if(state.source === 'osm'){
    collections.push(state.osmFc);
  } else {
    if(cat === 'all' || cat === 'building') collections.push(state.modelFc);
    if(cat === 'all' || cat === 'tree') collections.push(state.treesFc);
    if(cat === 'all' || cat === 'farm') collections.push(state.farmsFc);
    if(cat === 'all' || cat === 'barren') collections.push(state.barrenFc);
    if(cat === 'all' || cat === 'veg') collections.push(state.vegFc);
  }

  collections.forEach(function(fc){
    if(!fc || !fc.features || fc.features.length === 0) return;
    L.geoJSON(fc, {
      style: function(f){
        var isSelected = state.selectedFeature && (
          (state.selectedFeature.uid && state.selectedFeature.uid === f.properties.uid) ||
          (state.selectedFeature.id === f.properties.id && getFeatureCategory(state.selectedFeature) === getFeatureCategory(f))
        );
        return getFeatureStyle(f, isSelected);
      },
      onEachFeature: function(f, layer){
        layer.on('click', function(e){
          L.DomEvent.stopPropagation(e);
          state.selectedFeature = f.properties;
          renderFeatures();
          renderSidebar();
        });
      }
    }).addTo(geoLayersGroup);
  });
}

var inspector = document.getElementById('inspector');

function getAllVisibleFeatures(){
  var cat = state.activeCategory;
  var feats = [];
  if(state.source === 'osm'){
    return state.osmFc ? state.osmFc.features : [];
  }
  if((cat === 'all' || cat === 'building') && state.modelFc) feats.push(...state.modelFc.features);
  if((cat === 'all' || cat === 'farm') && state.farmsFc) feats.push(...state.farmsFc.features);
  if((cat === 'all' || cat === 'barren') && state.barrenFc) feats.push(...state.barrenFc.features);
  if((cat === 'all' || cat === 'tree') && state.treesFc) feats.push(...state.treesFc.features);
  if((cat === 'all' || cat === 'veg') && state.vegFc) feats.push(...state.vegFc.features);
  return feats;
}

function renderSidebar(){
  if(state.selectedFeature != null){
    renderDetail();
    return;
  }

  var m = state.metrics || {};
  var bCount = state.modelFc ? state.modelFc.features.length : 0;
  var tCount = state.treesFc ? state.treesFc.features.length : 0;
  var fCount = state.farmsFc ? state.farmsFc.features.length : 0;
  var barCount = state.barrenFc ? state.barrenFc.features.length : 0;
  var vegCount = state.vegFc ? state.vegFc.features.length : 0;

  var html = '';
  html += '<div><h3 class="panel-title">Cadastral AI Vision Metrics</h3>'+
    '<div class="stat-grid">'+
      '<div class="stat-tile" style="cursor:pointer;" onclick="setCat(\'building\')"><div class="num">'+bCount+'</div><div class="lbl">🏠 Structures</div></div>'+
      '<div class="stat-tile" style="cursor:pointer;" onclick="setCat(\'tree\')"><div class="num" style="color:#2D6A4F;">'+tCount+'</div><div class="lbl">🌳 Trees</div></div>'+
      '<div class="stat-tile" style="cursor:pointer;" onclick="setCat(\'farm\')"><div class="num" style="color:#8FAE5D;">'+fCount+'</div><div class="lbl">🌾 Farms</div></div>'+
      '<div class="stat-tile" style="cursor:pointer;" onclick="setCat(\'barren\')"><div class="num" style="color:#BFA27E;">'+barCount+'</div><div class="lbl">🏜️ Barren</div></div>'+
    '</div><div style="font-size:0.72rem;color:var(--text-dim);margin-top:8px;line-height:1.5;">Automated Deep Vision &amp; Visible Remote Sensing Indices (ExG, VARI, STI). Click tiles to filter.</div></div>';

  var visibleFeats = getAllVisibleFeatures();
  var priority = visibleFeats.slice(0, 15);

  html += '<div><h3 class="panel-title">Feature Inspection Queue ('+visibleFeats.length+' total)</h3>';
  if(priority.length === 0){
    html += '<div style="font-size:0.75rem;color:var(--text-faint);padding:8px 0;">No features detected in this category.</div>';
  } else {
    priority.forEach(function(f){
      var p = f.properties || {};
      var cat = getFeatureCategory(f);
      var icon = getFeatureIcon(cat);
      var name = p.name || (p.uid ? p.uid : ('#' + p.id));
      var al = p.alerts || [];
      var dots = al.map(a=>'<span class="dot" style="background:'+SEV_COLOR[(ALERT_META[a.type]||{}).sev||'ok']+'"></span>').join('');
      var uidKey = p.uid || ('BLDG-' + p.id);
      html += '<div class="queue-row" data-uid="'+uidKey+'"><span class="id">'+icon+' '+name+'</span><span class="dots">'+dots+'</span><span class="area">'+(p.area_m2||0)+' m²</span></div>';
    });
  }
  html += '</div>';

  html += '<div><h3 class="panel-title">Landcover Legend</h3>';
  html += '<div class="legend-row"><span style="width:14px;height:14px;background:#6CBE81;border:1px solid #28352E;border-radius:3px;display:inline-block;"></span><div><b>Building / Structure</b><small>AI Plinth regularized footprint</small></div></div>';
  html += '<div class="legend-row"><span style="width:14px;height:14px;background:#2D6A4F;border:1px solid #1B4332;border-radius:3px;display:inline-block;"></span><div><b>Tree Canopy / Orchard</b><small>High texture roughness &amp; ExG chlorophyll</small></div></div>';
  html += '<div class="legend-row"><span style="width:14px;height:14px;background:#8FAE5D;border:1px solid #40916C;border-radius:3px;display:inline-block;"></span><div><b>Agricultural Farm Plot</b><small>Active crops partitioned by bunds</small></div></div>';
  html += '<div class="legend-row"><span style="width:14px;height:14px;background:#BFA27E;border:1px solid #7F5539;border-radius:3px;display:inline-block;"></span><div><b>Barren Land / Fallow Soil</b><small>Warm earth hue &amp; Soil Tone Index (STI)</small></div></div>';
  html += '</div>';

  inspector.innerHTML = html;
  inspector.querySelectorAll('.queue-row').forEach(function(row){
    row.addEventListener('click', function(){
      var targetUid = row.getAttribute('data-uid');
      var all = getAllVisibleFeatures();
      var found = all.find(f => {
        var p = f.properties || {};
        return (p.uid && p.uid === targetUid) || ('BLDG-' + p.id === targetUid);
      });
      if(found){
        state.selectedFeature = found.properties;
        renderFeatures();
        renderSidebar();
      }
    });
  });
}

function renderDetail(){
  var p = state.selectedFeature;
  if(!p){ renderSidebar(); return; }

  var cat = (p.type === 'tree_canopy') ? 'tree' :
            (p.type === 'farm_plot') ? 'farm' :
            (p.type === 'barren_land') ? 'barren' :
            (p.type === 'vegetation') ? 'veg' : 'building';
  var icon = getFeatureIcon(cat);
  var name = p.name || (p.uid ? p.uid : ('Structure #' + p.id));
  var alerts = p.alerts || [];

  var html = '<div><h3 class="panel-title"><span class="back" id="backBtn" style="cursor:pointer;">&larr; Overview</span></h3>';
  html += '<div class="detail-head"><h2>'+icon+' '+name+'</h2><span class="badge" style="background:var(--surface-2);">'+(p.category || 'Land Entity')+'</span></div>';
  
  html += '<div class="kv-grid">'+
    '<div class="kv"><div class="k">Area (m²)</div><div class="v">'+(p.area_m2||0)+' m²</div></div>'+
    '<div class="kv"><div class="k">Imperial / Guntha</div><div class="v">'+(p.area_acres ? p.area_acres + ' Ac' : (p.area_sq_ft ? p.area_sq_ft + ' sqft' : 'N/A'))+'</div></div>'+
    '<div class="kv"><div class="k">Parcel ULPIN</div><div class="v" style="font-size:0.75rem;color:var(--accent);">'+(p.parcel_ulpin || 'Unassigned')+'</div></div>';

  if(cat === 'tree'){
    html += '<div class="kv"><div class="k">Crown Diameter</div><div class="v">'+(p.crown_diameter_m||'--')+' m</div></div>'+
      '<div class="kv"><div class="k">Excess Green (ExG)</div><div class="v">'+(p.mean_exg!==undefined?p.mean_exg:'--')+'</div></div>'+
      '<div class="kv"><div class="k">Chlorophyll (VARI)</div><div class="v">'+(p.mean_vari!==undefined?p.mean_vari:'--')+'</div></div>';
  } else if(cat === 'farm'){
    html += '<div class="kv"><div class="k">Perimeter</div><div class="v">'+(p.perimeter_m||'--')+' m</div></div>'+
      '<div class="kv"><div class="k">Crop Canopy Index</div><div class="v">'+(p.crop_canopy_index!==undefined?p.crop_canopy_index:'--')+'</div></div>'+
      '<div class="kv"><div class="k">Chlorophyll (VARI)</div><div class="v">'+(p.mean_vari!==undefined?p.mean_vari:'--')+'</div></div>';
  } else if(cat === 'barren'){
    html += '<div class="kv"><div class="k">Soil Tone Index (STI)</div><div class="v">'+(p.soil_tone_index!==undefined?p.soil_tone_index:'--')+'</div></div>'+
      '<div class="kv"><div class="k">Land Condition</div><div class="v" style="font-size:0.72rem;">'+(p.land_condition||'Dry Soil')+'</div></div>'+
      '<div class="kv"><div class="k">Perimeter</div><div class="v">'+(p.perimeter_m||'--')+' m</div></div>';
  } else {
    html += '<div class="kv"><div class="k">Unrecorded Status</div><div class="v">'+(p.unrecorded?'⚠️ UNRECORDED':'✔ Registered')+'</div></div>'+
      '<div class="kv"><div class="k">Alerts</div><div class="v">'+alerts.length+'</div></div>'+
      '<div class="kv"><div class="k">Type</div><div class="v">'+(p.type||'Structure')+'</div></div>';
  }
  html += '</div>';

  if(alerts.length){
    html += '<div class="findings">';
    alerts.forEach(function(a){
      var mm = ALERT_META[a.type] || {label: a.type || 'Notice', shape:'circle', sev:'warning'};
      html += '<div class="finding sev-'+mm.sev+'">'+iconSvg(mm.shape,mm.sev,18)+'<div><b>'+mm.label+'</b><p>'+(a.msg||'')+'</p><div class="cite">'+(a.citation||'')+'</div></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="clean-msg">&#10003; Standard verified entity. Satisfies statutory requirements.</div>';
  }

  var reportKey = p.uid || String(p.id);
  html += '<button class="report-btn" id="reportBtn">Generate Verification Note</button>';
  html += '<div class="report-box" id="reportBox"><span class="stamp">SYSTEM-GENERATED · DIGITAL SURVEY NOTE</span><pre id="reportText"></pre></div></div>';

  inspector.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', function(){
    state.selectedFeature = null;
    renderFeatures();
    renderSidebar();
  });
  document.getElementById('reportBtn').addEventListener('click', function(){
    var box = document.getElementById('reportBox');
    box.classList.toggle('open');
    if(box.classList.contains('open')){
      var note = state.reports[reportKey] || state.reports[String(p.id)] ||
        ("CADASTRAAI -- VERIFICATION NOTE\nEntity: " + name + "\nArea: " + (p.area_m2||0) + " m2\nParent ULPIN: " + (p.parcel_ulpin||'N/A') + "\nCategory: " + (p.category||'Landcover Feature'));
      document.getElementById('reportText').textContent = note;
    }
  });
}

window.setCat = function(c){
  state.activeCategory = c;
  state.selectedFeature = null;
  document.querySelectorAll('#categoryFilter button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-cat') === c);
  });
  renderFeatures();
  renderSidebar();
};

document.getElementById('categoryFilter').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-cat]');
  if(!btn) return;
  window.setCat(btn.getAttribute('data-cat'));
});

document.getElementById('layerToggle').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-layer]');
  if(!btn) return;
  document.querySelectorAll('#layerToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.source = btn.getAttribute('data-layer');
  state.selectedFeature = null;
  renderFeatures();
  renderSidebar();
});

})();
</script>
</body>
</html>
