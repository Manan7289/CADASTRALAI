<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CadastraAI — Compliance &amp; Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="wordmark">CADASTRA<span>AI</span></div>
      <div class="subtitle">Compliance &amp; Detection · Igatpuri, Maharashtra · OSM + CPU-Trained Model · Team ELAVI</div>
    </div>
    <nav class="segmented">
      <a href="index.html">CADASTRAL MAP</a>
      <a href="detection.html" class="active">COMPLIANCE &amp; DETECTION</a>
      <a href="model.html">MODEL OUTPUT</a>
      <a href="upload.html">UPLOAD YOUR OWN</a>
    </nav>
    <div class="segmented" id="layerToggle">
      <button data-layer="model" class="active">AI-EXTRACTED</button>
      <button data-layer="osm">OFFICIAL (OSM)</button>
    </div>
    <label class="toggle-field"><input type="checkbox" id="bufferToggle" checked> Buffer zones</label>
    <div class="status-chip" id="statusChip">Live model output</div>
  </header>

  <main class="workspace">
    <div class="map-panel">
      <div id="map"></div>
      <div class="loading" id="loadingScreen">Loading real AOI data, satellite mosaic and model output…</div>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="shared.js"></script>
<script>
(function(){
"use strict";

var map = initMap();
var state = {source:'model', selectedId:null, modelFc:null, osmFc:null, metrics:null, reports:null};
var geoLayer;

Promise.all([
  fetch(dataUrl('meta.json')).then(r=>r.json()),
  fetch(dataUrl('image.png')).then(r=>r.blob()),
  fetch(dataUrl('layers.json')).then(r=>r.json()),
  fetch(dataUrl('buildings.geojson')).then(r=>r.json()),
  fetch(dataUrl('osm_buildings.geojson')).then(r=>r.json()),
  fetch(dataUrl('metrics.json')).then(r=>r.json()),
  fetch(dataUrl('reports.json')).then(r=>r.json())
]).then(function(res){
  var meta = res[0], imgBlob = res[1], layers = res[2], modelFc = res[3], osmFc = res[4], metrics = res[5], reports = res[6];

  var refs = loadBaseLayers(map, meta, imgBlob, layers);
  document.getElementById('bufferToggle').addEventListener('change', function(e){
    if(e.target.checked) map.addLayer(refs.bufferGroup); else map.removeLayer(refs.bufferGroup);
  });

  state.modelFc = modelFc;
  state.osmFc = osmFc;
  state.metrics = metrics;
  state.reports = reports;

  renderBuildings();
  renderSidebar();
  document.getElementById('loadingScreen').style.display = 'none';
}).catch(function(err){
  document.getElementById('loadingScreen').textContent = 'Failed to load: ' + err + '  (did you run the backend pipeline through build_static.py first?)';
});

function currentFc(){ return state.source==='model' ? state.modelFc : state.osmFc; }

function severityOf(props){
  var alerts = props.alerts || [];
  if(alerts.some(a=>ALERT_META[a.type].sev==='critical')) return 'critical';
  if(alerts.some(a=>ALERT_META[a.type].sev==='warning')) return 'warning';
  if(alerts.some(a=>ALERT_META[a.type].sev==='change')) return 'change';
  return 'ok';
}

function renderBuildings(){
  if(geoLayer) map.removeLayer(geoLayer);
  var fc = currentFc();
  geoLayer = L.geoJSON(fc, {
    style:function(f){
      var sev = state.source==='model' ? severityOf(f.properties) : 'ok';
      var selected = state.source==='model' && f.properties.id===state.selectedId;
      return {
        color: selected ? '#45C7B8' : (sev==='ok' ? '#C9CDC4' : SEV_COLOR[sev]),
        weight: selected ? 2.6 : (sev==='ok' ? 0.8 : 1.6),
        fillColor: '#C9CDC4', fillOpacity: 0.55
      };
    },
    onEachFeature:function(f, layer){
      if(state.source==='model'){
        layer.on('click', function(){ state.selectedId = f.properties.id; renderBuildings(); renderSidebar(); });
      }
    }
  }).addTo(map);
}

var inspector = document.getElementById('inspector');

function statCounts(){
  var feats = state.modelFc.features;
  var flagged = feats.filter(f => (f.properties.alerts||[]).length>0).length;
  return {total: feats.length, flagged: flagged};
}

function renderSidebar(){
  if(state.selectedId!=null){ renderDetail(); return; }

  var counts = statCounts();
  var m = state.metrics;
  var html = '';
  if(m.method === 'unsupervised'){
    html += '<div><h3 class="panel-title">Detection Method</h3>'+
      '<div class="stat-grid">'+
        '<div class="stat-tile"><div class="num">'+m.buildings_detected+'</div><div class="lbl">Structures detected</div></div>'+
        '<div class="stat-tile"><div class="num">'+m.processing_seconds+'s</div><div class="lbl">Processing time</div></div>'+
      '</div><div style="font-size:0.72rem;color:var(--warning);margin-top:8px;line-height:1.5;">'+m.note+'</div></div>';
  } else {
    html += '<div><h3 class="panel-title">Model Performance (real, cross-validated)</h3>'+
      '<div class="stat-grid">'+
        '<div class="stat-tile"><div class="num" style="color:'+ (m.cv_building_recall_mean>=0.5?'var(--ok)':'var(--warning)') +'">'+Math.round(m.cv_building_recall_mean*100)+'%</div><div class="lbl">Held-out buildings found</div></div>'+
        '<div class="stat-tile"><div class="num">'+m.cv_roc_auc_mean.toFixed(2)+'</div><div class="lbl">ROC-AUC (held-out)</div></div>'+
        '<div class="stat-tile"><div class="num">'+Math.round(m.precision_in_verified_area*100)+'%</div><div class="lbl">Precision (verified area)</div></div>'+
        '<div class="stat-tile"><div class="num">'+m.train_seconds+'s</div><div class="lbl">CPU train time</div></div>'+
      '</div><div style="font-size:0.72rem;color:var(--text-faint);margin-top:8px;line-height:1.5;">RandomForest trained live on this machine (no GPU, no pretrained checkpoint) on OSM footprints from a fully-digitised housing colony ('+m.verified_colony_buildings+' buildings); recall and AUC are averaged over 5 random train/test splits, evaluated only on buildings held out of training. Applied to the full '+m.total_osm_buildings_in_aoi+'-building AOI for the map below.</div></div>';
  }

  html += '<div><h3 class="panel-title">Ward Overview</h3><div class="stat-grid">'+
    '<div class="stat-tile"><div class="num">'+counts.total+'</div><div class="lbl">Footprints extracted</div></div>'+
    '<div class="stat-tile"><div class="num" style="color:'+(counts.flagged?'var(--warning)':'var(--ok)')+'">'+counts.flagged+'</div><div class="lbl">Flagged by rule engine</div></div>'+
  '</div></div>';

  var priority = state.modelFc.features.slice().sort(function(a,b){
    return (b.properties.alerts||[]).length - (a.properties.alerts||[]).length;
  }).slice(0,8);
  html += '<div><h3 class="panel-title">Field Verification Queue</h3>';
  priority.forEach(function(f){
    var al = f.properties.alerts||[];
    var dots = al.map(a=>'<span class="dot" style="background:'+SEV_COLOR[ALERT_META[a.type].sev]+'"></span>').join('');
    html += '<div class="queue-row" data-id="'+f.properties.id+'"><span class="id">#'+f.properties.id+'</span><span class="dots">'+dots+'</span><span class="area">'+(f.properties.area_m2||0)+' m²</span></div>';
  });
  html += '</div>';

  html += '<div><h3 class="panel-title">Key / Legend</h3>';
  Object.keys(ALERT_META).forEach(function(k){
    var mm = ALERT_META[k];
    html += '<div class="legend-row">'+iconSvg(mm.shape,mm.sev,18)+'<div><b>'+mm.label+'</b></div></div>';
  });
  html += '</div>';

  inspector.innerHTML = html;
  inspector.querySelectorAll('.queue-row').forEach(function(row){
    row.addEventListener('click', function(){
      state.selectedId = parseInt(row.getAttribute('data-id'),10);
      renderBuildings(); renderSidebar();
    });
  });
}

function renderDetail(){
  var f = state.modelFc.features.find(x=>x.properties.id===state.selectedId);
  if(!f){ state.selectedId=null; renderSidebar(); return; }
  var p = f.properties;
  var alerts = p.alerts || [];

  var html = '<div><h3 class="panel-title"><span class="back" id="backBtn">&larr; Overview</span></h3>';
  html += '<div class="detail-head"><h2>Footprint #'+p.id+'</h2>'+(p.unrecorded?'<span style="color:var(--change);font-family:var(--font-mono);font-size:0.7rem;">UNRECORDED</span>':'')+'</div>';
  html += '<div class="kv-grid"><div class="kv"><div class="k">Area</div><div class="v">'+(p.area_m2||0)+' m²</div></div>'+
    '<div class="kv"><div class="k">Alerts</div><div class="v">'+alerts.length+'</div></div></div>';

  if(alerts.length){
    html += '<div class="findings">';
    alerts.forEach(function(a){
      var mm = ALERT_META[a.type];
      html += '<div class="finding sev-'+mm.sev+'">'+iconSvg(mm.shape,mm.sev,18)+'<div><b>'+mm.label+'</b><p>'+a.msg+'</p><div class="cite">'+a.citation+'</div></div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="clean-msg">&#10003; No issues detected by the automated rule engine</div>';
  }

  html += '<button class="report-btn" id="reportBtn">Generate Verification Note</button>';
  html += '<div class="report-box" id="reportBox"><span class="stamp">SYSTEM-GENERATED · SIMULATED WORKFLOW — NOT A LEGAL DOCUMENT</span><pre id="reportText"></pre></div></div>';

  inspector.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', function(){ state.selectedId=null; renderBuildings(); renderSidebar(); });
  document.getElementById('reportBtn').addEventListener('click', function(){
    var box = document.getElementById('reportBox');
    box.classList.toggle('open');
    if(box.classList.contains('open')){
      document.getElementById('reportText').textContent = state.reports[String(p.id)] || 'No report available.';
    }
  });
}

document.getElementById('layerToggle').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-layer]');
  if(!btn) return;
  document.querySelectorAll('#layerToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.source = btn.getAttribute('data-layer');
  state.selectedId = null;
  renderBuildings();
  renderSidebar();
});

})();
</script>
</body>
</html>
